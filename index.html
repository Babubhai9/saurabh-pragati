<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सौरभ & प्रगति | शुभ विवाह</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:radial-gradient(ellipse at top,#65100d 0%,#250605 65%,#100202 100%);font-family:Georgia,serif;color:#ffe8b0;overflow-x:hidden}
.wrap{text-align:center;width:min(100%,650px);animation:rise 1.2s ease both}.eyebrow{letter-spacing:3px;color:#f6d58b;font-size:13px;margin:0 0 16px;text-shadow:0 1px 8px #000}.card{display:block;position:relative;padding:9px;border:1px solid #e7c16b;border-radius:8px;background:linear-gradient(135deg,#8c5a16,#ffe6a0,#9d671e,#f7d887);box-shadow:0 0 0 4px #4a100b,0 18px 60px #000b,0 0 45px #d49b3d55;cursor:zoom-in;transition:transform .35s,box-shadow .35s}.card:hover{transform:translateY(-5px) scale(1.008);box-shadow:0 0 0 4px #4a100b,0 24px 70px #000c,0 0 55px #e7bb5d88}.card img{display:block;width:100%;height:auto;border-radius:3px}.hint{margin:18px 0 0;color:#f5d99a;font-size:14px;letter-spacing:.5px}.hint span{display:inline-block;animation:pulse 1.8s infinite}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}
.viewer{position:fixed;inset:0;background:#100202f2;display:none;place-items:center;padding:16px;z-index:5}.viewer.open{display:grid}.viewer img{max-width:min(95vw,850px);max-height:92vh;object-fit:contain;border:2px solid #d9b45d;box-shadow:0 15px 60px #000}.close{position:fixed;top:14px;right:18px;border:1px solid #e8c875;background:#5b100d;color:#fff1c9;border-radius:50%;width:42px;height:42px;font-size:25px;cursor:pointer}
</style></head>
<body><main class="wrap"><p class="eyebrow">॥ श्री गणेशाय नमः ॥</p><a class="card" id="openCard" href="invitation.png" aria-label="विवाह निमंत्रण बड़ा करके देखें"><img src="invitation.png" alt="सौरभ और प्रगति का विवाह निमंत्रण"></a><p class="hint"><span>✦</span> निमंत्रण पत्र को बड़ा देखने के लिए क्लिक करें <span>✦</span></p></main>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="विवाह निमंत्रण"><button class="close" id="close" aria-label="बंद करें">×</button><img src="invitation.png" alt="सौरभ और प्रगति का विवाह निमंत्रण"></div>
<script>const viewer=document.getElementById('viewer');document.getElementById('openCard').addEventListener('click',e=>{e.preventDefault();viewer.classList.add('open')});document.getElementById('close').addEventListener('click',()=>viewer.classList.remove('open'));viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('open')});</script></body></html>
